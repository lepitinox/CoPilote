<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-pilote de mission</title>
<style>
:root {
  --fond: #f6f7f9; --carte: #fff; --trait: #dfe3e8; --texte: #1c2430; --doux: #5d6878;
  --accent: #1f5f8b; --accent-fond: #e8f1f7;
  --vert: #1e7d4f; --vert-fond: #e3f4eb; --orange: #a35a00; --orange-fond: #fdf0dc;
  --rouge: #b3261e; --rouge-fond: #fbe7e5;
  /* séries des graphiques (palette validée, ordre fixe) */
  --serie-1: #2a78d6; --serie-1-clair: #9ec5f4; --serie-2: #eb6834;
  /* teintes des lots : toujours doublées du nom du lot */
  --lot-0: #e3eefb; --lot-0-t: #1c5cab; --lot-1: #fde9df; --lot-1-t: #a8421a;
  --lot-2: #dcf3ea; --lot-2-t: #0f6e4c; --lot-3: #eef0f3; --lot-3-t: #5d6878;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--texte);
  font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
header { background: var(--carte); border-bottom: 1px solid var(--trait); padding: 12px 20px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 17px; margin: 0; }
header .mission { color: var(--doux); }
header .droite { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.page { display: grid; grid-template-columns: 220px minmax(0, 1fr); align-items: start; }
nav { padding: 16px 10px; position: sticky; top: 55px; max-height: calc(100vh - 55px); overflow-y: auto; }
nav h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--doux);
  margin: 14px 10px 6px; }
nav h2:first-child { margin-top: 0; }
nav button { display: block; width: 100%; text-align: left; border: 0; background: none;
  padding: 6px 10px; border-radius: 6px; color: var(--texte); }
nav button:hover { background: #eceff3; }
nav button[aria-current="page"] { background: var(--accent-fond); color: var(--accent); font-weight: 600; }
main { padding: 24px 24px 64px; min-width: 0; }
@media (max-width: 860px) {
  .page { grid-template-columns: 1fr; }
  nav { position: static; max-height: none; display: flex; flex-wrap: wrap; gap: 2px;
    border-bottom: 1px solid var(--trait); background: var(--carte); }
  nav h2 { width: 100%; margin: 8px 10px 2px; }
  nav button { width: auto; }
  main { padding: 16px 16px 48px; }
}
main > div > h2 { font-size: 20px; margin: 0 0 4px; }
h3 { font-size: 15px; margin: 24px 0 8px; }
p.aide { color: var(--doux); margin: 0 0 16px; max-width: 80ch; }
.carte { background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; padding: 16px; }
.grille { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.tuile .valeur { font-size: 24px; font-weight: 600; }
.tuile .nom { color: var(--doux); font-size: 13px; }
.tuile .note { font-size: 13px; color: var(--doux); }
table { width: 100%; border-collapse: collapse; background: var(--carte); }
.cadre-table { border: 1px solid var(--trait); border-radius: 8px; overflow-x: auto; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--trait); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--doux);
  background: #fafbfc; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.cliquable { cursor: pointer; }
tbody tr.cliquable:hover { background: var(--accent-fond); }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.long { max-width: 340px; }
button, .bouton { font: inherit; border: 1px solid var(--trait); background: var(--carte);
  border-radius: 6px; padding: 6px 12px; cursor: pointer; color: var(--texte); }
button.principal { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--rouge); }
button.lien { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
button:disabled { opacity: .55; cursor: wait; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
[tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.barre { display: flex; gap: 8px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
.barre .pousse { margin-left: auto; }
.pastille { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12.5px;
  font-weight: 600; white-space: nowrap; }
.vert { background: var(--vert-fond); color: var(--vert); }
.orange { background: var(--orange-fond); color: var(--orange); }
.rouge { background: var(--rouge-fond); color: var(--rouge); }
.neutre { background: #eef0f3; color: var(--doux); }
.lot-0 { background: var(--lot-0); color: var(--lot-0-t); } .lot-1 { background: var(--lot-1); color: var(--lot-1-t); }
.lot-2 { background: var(--lot-2); color: var(--lot-2-t); } .lot-3 { background: var(--lot-3); color: var(--lot-3-t); }
.liste { display: grid; gap: 8px; }
.item { background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; padding: 12px 14px; }
.item .tete { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.item .titre { font-weight: 600; }
.item .detail { color: var(--doux); margin-top: 2px; }
.item blockquote { margin: 8px 0 0; padding: 6px 10px; background: var(--fond);
  border-radius: 6px; font-size: 14px; color: var(--doux); }
.item .actions { display: flex; gap: 8px; margin-top: 10px; }
.vide { color: var(--doux); padding: 20px; text-align: center; background: var(--carte);
  border: 1px dashed var(--trait); border-radius: 8px; }
.deux { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .deux { grid-template-columns: 1fr; } }
.menu { display: grid; gap: 6px; }
.menu button { text-align: left; }
.menu button[aria-current="true"] { border-color: var(--accent); background: var(--accent-fond); }
.menu small { display: block; color: var(--doux); }
dialog { border: 1px solid var(--trait); border-radius: 10px; padding: 0; width: min(640px, 94vw); }
dialog.large { width: min(1100px, 96vw); }
.niveaux-bloc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
@media (max-width: 760px) { .niveaux-bloc { grid-template-columns: 1fr; } }
.niveau-bloc { display: flex; flex-direction: column; gap: 6px; }
.niveau-bloc button { text-align: left; }
.niveau-bloc p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--texte); }
.niveau-bloc small { color: var(--doux); font-size: 12px; }
dialog::backdrop { background: rgba(20, 28, 40, .4); }
dialog form { padding: 20px; display: grid; gap: 12px; }
dialog h3 { margin: 0; font-size: 17px; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--doux); }
label.case { display: flex; align-items: center; gap: 8px; color: var(--texte); font-size: 15px; }
label.case input { width: auto; }
input, select, textarea { font: inherit; color: var(--texte); padding: 7px 9px;
  border: 1px solid var(--trait); border-radius: 6px; background: #fff; width: 100%; }
textarea { min-height: 84px; resize: vertical; }
.champs { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.champs .large { grid-column: 1 / -1; }
@media (max-width: 560px) { .champs { grid-template-columns: 1fr; } }
.rendu { background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; padding: 20px 24px; overflow-x: auto; }
.rendu h1 { font-size: 20px; margin: 0 0 8px; }
.rendu h2 { font-size: 16px; margin: 20px 0 8px; }
.rendu table { border: 1px solid var(--trait); font-size: 14px; }
.rendu td, .rendu th { border: 1px solid var(--trait); }
#edition { min-height: 460px; font: 13px/1.5 Consolas, monospace; }
#message { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
  background: var(--texte); color: #fff; padding: 10px 16px; border-radius: 8px;
  max-width: min(680px, 92vw); display: none; }
#message.erreur { background: var(--rouge); }
.bandeau { background: var(--orange-fond); color: var(--orange); border-radius: 8px;
  padding: 10px 14px; margin-bottom: 16px; }
.defile { overflow-x: auto; padding-bottom: 6px; }
.puce { display: block; width: 100%; text-align: left; border: 1px solid var(--trait); background: var(--carte);
  border-radius: 6px; padding: 5px 9px; margin-top: 6px; font-size: 14px; }
.puce small { display: block; color: var(--doux); font-size: 12.5px; }
.puce:hover { border-color: var(--accent); }

/* feuille de route */
.route { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 0; min-width: min-content; }
.route .lot { padding: 0 12px; }
.route .periode { font-size: 30px; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; }
.route .axe { position: relative; height: 26px; margin: 10px -12px; }
.route .axe::before { content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 3px; background: var(--trait); }
.route .axe::after { content: ""; position: absolute; left: 12px; top: 5px; width: 17px; height: 17px;
  border-radius: 50%; background: var(--accent); border: 3px solid var(--fond); }
.route .lot.sans-date .axe::after { background: var(--doux); }
.route .nom { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-weight: 600; font-size: 16px; }
.route .bloc { margin-top: 12px; padding: 10px; border-radius: 8px; background: var(--carte); border: 1px solid var(--trait); }
.route .bloc.prerequis { background: none; border-style: dashed; border-color: #b8c0cb; }
.route .bloc h4 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--doux); }

/* story map */
.storymap th.etape { background: var(--accent); color: #fff; text-transform: none; font-size: 14px; letter-spacing: 0; }
.storymap th.ligne { text-transform: none; font-size: 14px; letter-spacing: 0; white-space: normal; min-width: 96px; }
.storymap td { min-width: 150px; }
.story { display: block; width: 100%; text-align: left; border: 0; border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; font-size: 13.5px; }
.story .marques { display: block; font-size: 11.5px; font-weight: 600; margin-top: 2px; }

/* macro-planning */
.plan { position: relative; min-width: 760px; background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; }
.plan .rang { display: grid; grid-template-columns: 170px 1fr; border-bottom: 1px solid var(--trait); }
.plan .rang:last-child { border-bottom: 0; }
.plan .rang > .libelle { padding: 8px 10px; font-weight: 600; font-size: 14px; border-right: 1px solid var(--trait); }
.plan .piste { position: relative; }
.plan .mois { display: grid; }
.plan .mois span { padding: 6px 4px; font-size: 12px; color: var(--doux); text-align: center; border-left: 1px solid var(--trait); white-space: nowrap; overflow: hidden; }
.plan .mois span:first-child { border-left: 0; }
.plan .ligne { position: relative; height: 34px; }
.plan .tache { position: absolute; top: 5px; height: 24px; border-radius: 4px; background: var(--serie-1); color: #fff;
  font-size: 12.5px; padding: 3px 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 0; text-align: left; }
.plan .tache.passee { background: #7f8b9a; }
.plan .jalon { position: absolute; top: 4px; transform: translateX(-9px); display: flex; align-items: center; gap: 6px;
  white-space: nowrap; font-size: 12.5px; border: 0; background: none; padding: 0; }
.plan .jalon i { width: 14px; height: 14px; background: var(--texte); transform: rotate(45deg); flex: none; margin: 4px 2px; }
.plan .jalon.atteint i { background: var(--vert); }
.plan .jalon .report { color: var(--orange); font-weight: 600; }
.plan .reference { position: absolute; top: 9px; width: 10px; height: 10px; transform: translateX(-5px) rotate(45deg);
  border: 2px solid var(--doux); background: var(--carte); pointer-events: none; }
.reponses { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.reponse { border-left: 4px solid var(--trait); }
.reponse.vert { border-left-color: var(--vert); background: var(--carte); color: var(--texte); }
.reponse.orange { border-left-color: var(--orange); background: var(--carte); color: var(--texte); }
.reponse.rouge { border-left-color: var(--rouge); background: var(--carte); color: var(--texte); }
.reponse h3 { margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
.reponse ul { margin: 8px 0 0; padding-left: 18px; color: var(--doux); font-size: 13.5px; }
.frise { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.plan .jalon.gauche { flex-direction: row-reverse; transform: translateX(calc(-100% + 9px)); }
.plan .hors { position: absolute; top: 7px; font-size: 12.5px; white-space: nowrap; }
.plan .grille-mois, .plan .aujourdhui { position: absolute; top: 0; bottom: 0; pointer-events: none; }
.plan .grille-mois { border-left: 1px solid #eef0f3; }
.plan .aujourdhui { border-left: 2px solid var(--rouge); }

/* organisation */
.orga { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 14px; align-items: start; }
@media (max-width: 1000px) { .orga { grid-template-columns: 1fr; } }
.orga .zone { border: 1px solid var(--trait); border-radius: 10px; padding: 12px; background: var(--carte); }
.orga .zone.coeur { border: 2px solid var(--accent); background: var(--accent-fond); }
.orga .zone.externe { grid-column: 1 / -1; border-style: dashed; }
.orga .zone h3 { margin: 0 0 2px; }
.orga .entite { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--doux); margin: 12px 0 0; }
.orga .acteurs { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.orga .puce.lie { border-color: var(--orange); }
.orga .puce .lien-adh { color: var(--orange); font-weight: 600; }

/* sprint */
.sprint { display: grid; grid-template-columns: 1fr 2.2fr 1fr; gap: 10px; }
@media (max-width: 800px) { .sprint { grid-template-columns: 1fr; } }
.sprint .phase { border-radius: 8px; border: 1px solid var(--trait); background: var(--carte); padding: 12px; }
.sprint .phase > h4 { margin: 0 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--doux); }
.sprint .rite { border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; margin-bottom: 10px; }
.sprint .rite b { display: block; }
.sprint .rite span { color: var(--doux); font-size: 13.5px; }

/* RACI */
.raci td.c, .raci th.c { text-align: center; padding: 6px 4px; min-width: 58px; }
.raci th.c { white-space: normal; }
.raci td.c button { width: 30px; height: 28px; padding: 0; font-weight: 700; border-radius: 6px; }
.raci .R { background: var(--accent); border-color: var(--accent); color: #fff; }
.raci .A { background: var(--texte); border-color: var(--texte); color: #fff; }
.raci .C { background: var(--accent-fond); color: var(--accent); border-color: #bcd5e6; }
.raci .I { background: #eef0f3; color: var(--doux); }
.raci tr.domaine td { background: #fafbfc; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--doux); }

/* graphiques */
.graphes { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
@media (max-width: 520px) { .graphes { grid-template-columns: 1fr; } }
.graphe { position: relative; }
.graphe h3 { margin: 0; }
.graphe .sous { color: var(--doux); font-size: 13px; margin: 0 0 6px; }
.graphe svg { display: block; width: 100%; height: auto; overflow: visible; }
.graphe .legende { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--doux); margin-top: 4px; }
.graphe .legende i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.graphe .bulle { position: absolute; pointer-events: none; background: var(--texte); color: #fff; font-size: 13px;
  padding: 6px 9px; border-radius: 6px; white-space: nowrap; display: none; z-index: 2; }
.graphe .bulle b { display: block; }
.graphe .bulle i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }

/* risques */
.matrice { display: grid; grid-template-columns: auto repeat(3, 1fr); gap: 4px; max-width: 420px; }
.matrice .case { min-height: 62px; border-radius: 6px; padding: 6px; display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
.matrice .axe-y, .matrice .axe-x { font-size: 12px; color: var(--doux); display: flex; align-items: center; justify-content: center; text-align: center; }
.matrice .axe-y { padding-right: 6px; }
.lettre { display: inline-flex; width: 24px; height: 24px; border-radius: 50%; align-items: center; justify-content: center;
  background: var(--texte); color: #fff; font-size: 12.5px; font-weight: 700; flex: none; }
.evo { white-space: nowrap; font-weight: 600; }
.exports { display: inline-flex; gap: 6px; padding-left: 8px; border-left: 1px solid var(--trait); }
.personnes { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2px 10px;
  max-height: 210px; overflow-y: auto; border: 1px solid var(--trait); border-radius: 6px; padding: 6px 8px; }
.metiers { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.metiers button.pastille { border: 0; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600; }
.chip { display: inline-block; background: #eef0f3; color: var(--texte); border-radius: 999px; padding: 1px 8px; font-size: 12.5px; margin: 0 4px 4px 0; white-space: nowrap; }
.agenda { display: grid; grid-template-columns: repeat(5, minmax(130px, 1fr)); gap: 6px; }
.agenda .jour { background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; padding: 8px; min-height: 92px; }
.agenda .jour.passe { opacity: .55; }
.agenda .jour h4 { margin: 0 0 6px; font-size: 12px; color: var(--doux); font-weight: 600; text-transform: capitalize; }
.agenda .seance { display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--accent); background: var(--accent-fond);
  border-radius: 4px; padding: 3px 6px; margin-bottom: 4px; font-size: 12.5px; }
.agenda .seance b { display: block; font-size: 12px; color: var(--accent); }
@media (max-width: 760px) { .agenda { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Co-pilote de mission</h1>
  <select id="choix-mission" aria-label="Mission ouverte" style="width:auto;max-width:360px"></select>
  <span class="mission" id="nom-mission" hidden></span>
  <div class="droite">
    <span class="pastille neutre" id="etat-llm"></span>
    <button id="btn-nouvelle" class="principal" title="Créer une mission, en reprenant au besoin le cadre d'une mission existante">+ Nouvelle mission</button>
    <button id="btn-missions" title="Ouvrir, importer, exporter ou mettre à la corbeille une mission">Missions</button>
  </div>
</header>
<div class="page">
  <nav id="menu" aria-label="Vues"></nav>
  <main id="vue"></main>
</div>
<dialog id="dialogue"></dialog>
<div id="message" role="status"></div>
<script src="/static/app.js"></script>
<script src="/static/cadre.js"></script>
<script src="/static/pilotage.js"></script>
<script src="/static/graphes.js"></script>
<script src="/static/finances.js"></script>
<script src="/static/changements.js"></script>
<script src="/static/pilote.js"></script>
<script>demarrer();</script>
</body>
</html>
